name: Earnest
description: >-
  Earnest is a technology-driven consumer finance lender headquartered in San Francisco,
  offering student loan refinancing, private student loans, Parent PLUS loan refinancing,
  and personal loans through Earnest Operations LLC and its bank partner FinWise Bank.
  Founded in 2013 and backed by investors including Andreessen Horowitz (a16z), Battery
  Ventures, and Slow Ventures, Earnest uses data-driven underwriting and merit-based pricing
  to serve borrowers, reporting more than $24 billion in student loans refinanced and over
  420,000 clients. Earnest is a consumer-facing lending brand and does not currently publish
  a public developer API, developer portal, or API reference; this profile captures its
  public web, security, and legal surface for the API Evangelist network.
